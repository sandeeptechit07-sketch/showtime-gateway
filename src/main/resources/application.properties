spring.application.name=showtime-gateway
server.port=8080

# Movie Service API route
spring.cloud.gateway.server.webflux.routes[0].id=movie-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://movie-service:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/movies/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Movie Service OpenAPI route
spring.cloud.gateway.server.webflux.routes[1].id=movie-service-openapi
spring.cloud.gateway.server.webflux.routes[1].uri=http://movie-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/movies/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[1].order=-1

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=ShowTime Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs

springdoc.swagger-ui.urls[1].name=Movie Service
springdoc.swagger-ui.urls[1].url=/api/movies/v3/api-docs

springdoc.swagger-ui.urls-primary-name=ShowTime Gateway