name: Showtime Gateway CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: sandeep07k/showtime-gateway

jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw clean test

      - name: Build application
        run: ./mvnw package -DskipTests


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      
      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sandeep07k/showtime-gateway:latest
            sandeep07k/showtime-gateway:${{ github.sha }}

      - name: Trigger infrastructure deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: sandeep07k/showtime-infrastructure
          event-type: deploy-gateway
          client-payload: '{"image_tag":"${{ github.sha }}"}'
